# ============================================================
#  圆心菜单预设（XpPenPad 与 Xournal++ 插件共用这一份）
# ============================================================
#  扇区按顺时针排列，第 1 格在正上方。
#  最多 8 格；想要几格就写几节 [sectorN]，中间不要断号。
#
#  tool  : pen / highlighter / eraser / text / selectRect /
#          selectRegion / selectObject / hand / verticalSpace
#  size  : veryThin / thin / medium / thick / veryThick
#          （eraser 和 hand 可以省略 size 与 color）
#  color : 6 位十六进制 RGB，不要写 # 号
#  label : 圆盘上显示的名字，尽量短（2~4 个字）
#
#  改完不用重启：插件每次调用都重新读这个文件，
#  小工具在托盘菜单点「重载预设」即可。
# ============================================================

[sector1]
label=黑 细
tool=pen
size=thin
color=000000

[sector2]
label=红 中
tool=pen
size=medium
color=d32f2f

[sector3]
label=蓝 中
tool=pen
size=medium
color=1565c0

[sector4]
label=绿 中
tool=pen
size=medium
color=2e7d32

[sector5]
label=黑 粗
tool=pen
size=thick
color=000000

[sector6]
label=荧光黄
tool=highlighter
size=thick
color=ffe082

[sector7]
label=荧光绿
tool=highlighter
size=thick
color=c5e1a5

[sector8]
label=橡皮
tool=eraser
