; ============================================================
;  XpPenPad 配置
;  改完需要重启小工具。
; ============================================================

[hotkeys]
; 这两个必须与「高漫驱动里给侧键设置的按键」完全一致。
;
; 实测发现：高漫 1060PRO 的驱动在笔按键上「修饰键」那一项不生效，
; 不管 CombKeyMask 写成几，实际只发出裸功能键。所以这里一律用裸 F 键。
;
; 驱动里请这样设：
;   侧键1（平移）→ F3
;   侧键2（圆盘）→ F4
;
pan_ctrl=0
pan_alt=0
pan_shift=0
pan_win=0
pan_key=F3

menu_ctrl=0
menu_alt=0
menu_shift=0
menu_win=0
menu_key=F4

[behavior]
; 只在这个进程是前台窗口时生效；写 * 表示全局都生效
target=xournalpp.exe

; 光标移动超过多少像素才算「拖动」，低于这个值松开 = 单击
threshold=26

; 把收到的按键写进日志（只记「带修饰键的按键」和 F1~F24，不会记录普通打字）
debug_keys=1
debug_shot=1

; 笔尖坐标用哪个来源：
;   auto   = 原始输入有新鲜数据就用它，没有就退回系统光标（默认）
;   raw    = 只用原始输入（绕过 GetCursorPos）
;   cursor = 只用系统光标（回到老行为）
; 不管选哪个，日志里都会同时打印另一个来源，方便对照差多少。
pen_source=auto

; 万一坐标系统性偏移，先用这两个值顶一下（像素）
pen_offset_x=0
pen_offset_y=0

; 原始输入设备名子串过滤，例如 VID_256C。留空 = 接受任何「绝对定位」设备。
raw_device=

; 笔的原始坐标量程（16 位值）。留 0 = 未标定，此时只能用系统光标。
; 标定方法：笔尖依次停在数位板工作区的四个角，从日志里读出四个点的值。
; 实测原生量程：X/Y 均顶到 32767(2^15-1)，驱动界面 50800x31760 是激活区单位、非 HID 原始值
pen_raw_max_x=32767
pen_raw_max_y=32767
pen_raw_min_x=0
pen_raw_min_y=0

; 把每个原始输入事件写进日志（非常吵，只在排查设备类型时开）
debug_raw=0

[paths]
; 留空则自动按以下顺序找：
;   1) %LOCALAPPDATA%\xournalpp\plugins\drawboard-pen\presets.ini
;   2) 本目录的 ..\plugins\drawboard-pen\presets.ini
presets=

